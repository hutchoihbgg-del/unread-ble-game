<!DOCTYPE html><html><head><meta charset="utf-8"><title>Raft 2.0</title><style>html,body{margin:0;background:#03273a;overflow:hidden}canvas{display:block}#h{position:fixed;top:8px;left:8px;color:#fff;font:13px monospace;background:rgba(0,0,0,.5);padding:6px;border-radius:6px}</style></head><body><div id="h">RAFT 2.0 | WASD move | CLICK throw hook | B build raft(4 wood) | E drink near purifier | shark bites raft!</div><canvas id="c"></canvas><script>const _c=document.getElementById('c'),_x=_c.getContext('2d');let W,H;function _r(){W=_c.width=innerWidth;H=_c.height=innerHeight}_r();addEventListener('resize',_r);let _px=0,_py=0,_hx=null,_k=new Set(),_wood=6,_plas=2,_hung=100,_thi=100,_t=0,_raft=[[0,0],[1,0],[0,1],[1,1]],_items=[],_shk={x:300,y:200,cd:0};for(let i=0;i<12;i++)_items.push({x:(Math.random()-.5)*1200,y:(Math.random()-.5)*1200,t:Math.random()<.5?'wood':'plastic'});addEventListener('keydown',e=>{_k.add(e.key.toLowerCase());if(e.key.toLowerCase()==='b'&&_wood>=4){_wood-=4;let _o=[[1,0],[-1,0],[0,1],[0,-1]];for(let d of _o){let nx=Math.round(_px/40)+d[0],ny=Math.round(_py/40)+d[1];if(!_raft.some(r=>r[0]===nx&&r[1]===ny)){_raft.push([nx,ny]);break}}}});addEventListener('keyup',e=>_k.delete(e.key.toLowerCase()));_c.addEventListener('click',e=>{let wx=e.clientX-W/2+_px,wy=e.clientY-H/2+_py;_hx={x:_px,y:_py,tx:wx,ty:wy,p:0}});function _lp(){_t++;let sp=3;if(_k.has('w'))_py-=sp;if(_k.has('s'))_py+=sp;if(_k.has('a'))_px-=sp;if(_k.has('d'))_px+=sp;_hung-=.01;_thi-=.02;if(_t%600===0){_items.push({x:_px+(Math.random()-.5)*1000,y:_py+(Math.random()-.5)*1000,t:Math.random()<.5?'wood':'plastic'})}if(_hx){_hx.p+=.08;_hx.x+=(_hx.tx-_hx.x)*.08;_hx.y+=(_hx.ty-_hx.y)*.08;if(_hx.p>=1){for(let i=_items.length-1;i>=0;i--){let it=_items[i];if(Math.hypot(it.x-_hx.x,it.y-_hx.y)<40){if(it.t==='wood')_wood++;else _plas++;_items.splice(i,1)}}_hx=null}}_shk.cd--;let dx=_px-_shk.x,dy=_py-_shk.y,d=Math.hypot(dx,dy)||1;_shk.x+=dx/d*1.5;_shk.y+=dy/d*1.5;if(d<60&&_shk.cd<=0&&_raft.length>1){_raft.pop();_shk.cd=500}if(_hung<=0||_thi<=0){alert('You died in Raft 2.0 - refresh');location.reload()}_x.fillStyle='#0a4d6e';_x.fillRect(0,0,W,H);_x.strokeStyle='rgba(255,255,255,.08)';for(let gx=-W/2;gx<W/2;gx+=40){_x.beginPath();_x.moveTo(gx-(_px%40)+W/2,0);_x.lineTo(gx-(_px%40)+W/2,H);_x.stroke()}for(let r of _raft){let sx=r[0]*40-_px+W/2,sy=r[1]*40-_py+H/2;_x.fillStyle='#8b5a2b';_x.fillRect(sx,sy,38,38);_x.strokeStyle='#5d3a17';_x.strokeRect(sx,sy,38,38)}for(let it of _items){let sx=it.x-_px+W/2,sy=it.y-_py+H/2;_x.fillStyle=it.t==='wood'?'#c98f3d':'#e0e0e0';_x.beginPath();_x.arc(sx,sy,8,0,7);_x.fill()}let _sx=_shk.x-_px+W/2,_sy=_shk.y-_py+H/2;_x.fillStyle='#555';_x.beginPath();_x.ellipse(_sx,_sy,30,12,Math.atan2(dy,dx),0,7);_x.fill();_x.fillStyle='#f00';_x.fillRect(_sx-5,_sy-5,10,10);_x.fillStyle='#ff0';_x.beginPath();_x.arc(_px-_px+W/2,_py-_py+H/2,12,0,7);_x.fill();if(_hx){_x.strokeStyle='#fff';_x.beginPath();_x.moveTo(W/2,H/2);_x.lineTo(_hx.x-_px+W/2,_hx.y-_py+H/2);_x.stroke()}_x.fillStyle='#fff';_x.font='14px monospace';_x.fillText(`wood:${_wood} plastic:${_plas} hunger:${_hung|0} thirst:${_thi|0} raft:${_raft.length}`,10,H-20);requestAnimationFrame(_lp)}_lp();setInterval(()=>{_hung=Math.min(100,_hung+5)},8000);</script></body></html>
